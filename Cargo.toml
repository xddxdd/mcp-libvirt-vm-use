[package]
name = "mcp-libvirt"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
rsa = { version = "0.9", features = ["sha1"] }
sha1 = "0.10"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
rmcp = { version = "3", features = ["transport-io", "schemars"] }
virt = "0.4"